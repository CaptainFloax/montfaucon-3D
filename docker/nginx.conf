# Service statique pour la carte 3D. Rien de dynamique : uniquement des
# fichiers, compressés et correctement typés pour les modules ES.
server {
    listen      80;
    listen      [::]:80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    charset       utf-8;
    server_tokens off;

    # scene.json fait ~1,6 Mo : compressé il tombe sous les 300 Ko.
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        application/javascript text/javascript application/json
                      text/css text/plain image/svg+xml application/manifest+json;

    # Page purement statique : aucun script tiers, aucune remontée de données.
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "SAMEORIGIN"         always;
    add_header Referrer-Policy        "no-referrer"        always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;

    # `expires` suffit à poser Cache-Control sans casser l'héritage des
    # en-têtes ci-dessus (add_header dans un location les remplacerait).
    location = /index.html { expires -1;  }
    location /vendor/      { expires 30d; }
    location /src/         { expires 1h;  }
    location /data/        { expires 1h;  }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
